name: ZIPING_FWD_001 Forward Test

on:
  push:
    branches: [main]
    paths:
      - 'ops/ziping-score-trigger.json'
  schedule:
    # Redundant same-day pre-anchor attempts in Asia/Shanghai. GitHub Actions
    # scheduled runs have shown multi-hour delays, so one 08:00 cron is not
    # reliable enough for a 09:25 immutable anchor. All attempts are idempotent.
    # 00:17 / 02:47 / 05:17 Asia/Shanghai, Monday-Friday.
    - cron: '17 16 * * 0-4'
    - cron: '47 18 * * 0-4'
    - cron: '17 21 * * 0-4'
    # 18:37 Asia/Shanghai, Monday-Friday, after the close with provider buffer.
    - cron: '37 10 * * 1-5'
    # 07:27 Asia/Shanghai, Tuesday-Saturday, catch-up score for provider latency.
    - cron: '27 23 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'signal or score'
        required: true
        default: 'signal'
        type: choice
        options:
          - signal
          - score
      date:
        description: 'Signal date YYYY-MM-DD; blank uses current Shanghai date'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ziping-fwd-001
  cancel-in-progress: false

jobs:
  signal:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '17 16 * * 0-4') ||
      (github.event_name == 'schedule' && github.event.schedule == '47 18 * * 0-4') ||
      (github.event_name == 'schedule' && github.event.schedule == '17 21 * * 0-4') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'signal')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e .
      - name: Resolve date and generate immutable record
        id: generate
        shell: bash
        run: |
          DATE='${{ inputs.date }}'
          if [ -z "$DATE" ]; then
            DATE=$(TZ=Asia/Shanghai date +%F)
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          OUT="forward/ZIPING_FWD_001/signals/${DATE}.json"
          if [ -e "$OUT" ]; then
            echo "Signal already exists; refusing to overwrite and treating redundant run as idempotent."
            exit 0
          fi
          python -m metaalpha.forward_ziping signal --date "$DATE" --out "$OUT"
      - name: Commit precommit record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forward/ZIPING_FWD_001/signals/
          if git diff --cached --quiet; then
            echo 'Nothing new to commit.'
            exit 0
          fi
          git commit -m "forward: precommit ZIPING_FWD_001 ${{ steps.generate.outputs.date }}"
          git pull --rebase origin main
          git push origin HEAD:main

  score:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'schedule' && github.event.schedule == '37 10 * * 1-5') ||
      (github.event_name == 'schedule' && github.event.schedule == '27 23 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'score')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install data dependencies
        run: pip install -e '.[data]'
      - name: Score realized forward evidence on pinned Sina data
        run: |
          END=$(TZ=Asia/Shanghai date +%Y%m%d)
          python -m metaalpha.forward_ziping_safe_score \
            --signals-dir forward/ZIPING_FWD_001/signals \
            --out-dir forward/ZIPING_FWD_001/status \
            --provider sina \
            --symbol 000001 \
            --start 20260817 \
            --end "$END"
      - name: Commit status and one-time gate if created
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forward/ZIPING_FWD_001/status/
          if git diff --cached --quiet; then
            echo 'No status change to commit.'
            exit 0
          fi
          git commit -m 'forward: update ZIPING_FWD_001 realized status'
          git pull --rebase origin main
          git push origin HEAD:main
