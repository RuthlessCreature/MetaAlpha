name: ZIPING_FWD_001 Forward Test

on:
  schedule:
    # 08:00 Asia/Shanghai, Monday-Friday. A delayed run after 09:25 is
    # automatically marked ineligible by the signal record itself.
    - cron: '0 0 * * 1-5'
    # 16:30 Asia/Shanghai, Monday-Friday, after the A-share close.
    - cron: '30 8 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'signal or score'
        required: true
        default: 'signal'
        type: choice
        options:
          - signal
          - score
      date:
        description: 'Signal date YYYY-MM-DD; blank uses current Shanghai date'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ziping-fwd-001
  cancel-in-progress: false

jobs:
  signal:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 0 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'signal')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e .
      - name: Resolve date and generate immutable record
        id: generate
        shell: bash
        run: |
          DATE='${{ inputs.date }}'
          if [ -z "$DATE" ]; then
            DATE=$(TZ=Asia/Shanghai date +%F)
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          OUT="forward/ZIPING_FWD_001/signals/${DATE}.json"
          if [ -e "$OUT" ]; then
            echo "Signal already exists; refusing to overwrite and treating rerun as idempotent."
            exit 0
          fi
          python -m metaalpha.forward_ziping signal --date "$DATE" --out "$OUT"
      - name: Commit precommit record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forward/ZIPING_FWD_001/signals/
          if git diff --cached --quiet; then
            echo 'Nothing new to commit.'
            exit 0
          fi
          git commit -m "forward: precommit ZIPING_FWD_001 ${{ steps.generate.outputs.date }}"
          git pull --rebase origin main
          git push origin HEAD:main

  score:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '30 8 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'score')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install data dependencies
        run: pip install -e '.[data]'
      - name: Score realized forward evidence on pinned Sina data
        run: |
          END=$(TZ=Asia/Shanghai date +%Y%m%d)
          python -m metaalpha.forward_ziping score \
            --signals-dir forward/ZIPING_FWD_001/signals \
            --out-dir forward/ZIPING_FWD_001/status \
            --provider sina \
            --symbol 000001 \
            --start 20260817 \
            --end "$END"
      - name: Commit status and one-time gate if created
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forward/ZIPING_FWD_001/status/
          if git diff --cached --quiet; then
            echo 'No status change to commit.'
            exit 0
          fi
          git commit -m 'forward: update ZIPING_FWD_001 realized status'
          git pull --rebase origin main
          git push origin HEAD:main
