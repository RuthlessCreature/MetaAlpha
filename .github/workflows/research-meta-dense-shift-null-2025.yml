name: META_DENSE_SHIFT_NULL_2025_001 Dense shifted-state null

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-meta-dense-shift-null-2025.yml'

permissions:
  contents: write

jobs:
  worker:
    strategy:
      fail-fast: false
      matrix:
        branch: [cycle, ziping, qimen, meihua]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
      - name: Install frozen META runtime
        run: |
          pip install -r requirements/meta-fwd-001.lock.txt
          pip install -e . --no-deps
      - name: Run dense shifted-state worker
        run: >-
          python -m metaalpha.research_meta_dense_shift_null_2025 worker
          --branch '${{ matrix.branch }}'
          --provider sina
          --symbol 000001
          --raw-start 19901219
          --test-start 20250101
          --end 20260817
          --out-dir work
      - uses: actions/upload-artifact@v4
        with:
          name: dense-shift-${{ matrix.branch }}
          path: work/
          retention-days: 7

  aggregate:
    needs: worker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
      - name: Install frozen META runtime
        run: |
          pip install -r requirements/meta-fwd-001.lock.txt
          pip install -e . --no-deps
      - uses: actions/download-artifact@v4
        with:
          pattern: dense-shift-*
          path: work
          merge-multiple: true
      - name: Aggregate dense null family
        run: >-
          python -m metaalpha.research_meta_dense_shift_null_2025 aggregate
          --input-dir work
          --out reports/meta_dense_shift_null_2025_001
      - name: Commit retrospective report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/meta_dense_shift_null_2025_001/
          if git diff --cached --quiet; then
            echo 'No report change.'
            exit 0
          fi
          git commit -m 'research: record META_DENSE_SHIFT_NULL_2025_001 results'
          git pull --rebase origin main
          git push origin HEAD:main
