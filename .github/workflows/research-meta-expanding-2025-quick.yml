name: META_HIST_EXPANDING_C001_2025_001 Quick Daily Expanding

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-meta-expanding-2025-quick.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
      - name: Install frozen META runtime
        run: |
          pip install -r requirements/meta-fwd-001.lock.txt
          pip install -e . --no-deps
      - name: Fetch one shared market snapshot
        run: |
          mkdir -p shared
          python - <<'PY'
          from pathlib import Path
          from metaalpha.data_sources import fetch_akshare_index
          raw, manifest = fetch_akshare_index(symbol='000001', start_date='19901219', end_date='20260817', provider='sina')
          raw.to_csv('shared/raw.csv', index=False)
          Path('shared/data_manifest.json').write_text(manifest.to_json() + '\n', encoding='utf-8')
          print(manifest.to_json())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: meta-expanding-shared-market
          path: shared/
          retention-days: 7

  worker:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        model: [baseline, cycle, ziping, qimen, meihua, liuyao_hash]
        chunk: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
      - name: Install frozen META runtime
        run: |
          pip install -r requirements/meta-fwd-001.lock.txt
          pip install -e . --no-deps
      - uses: actions/download-artifact@v4
        with:
          name: meta-expanding-shared-market
          path: shared
      - name: Run fixed-C expanding worker chunk
        run: >-
          python -m metaalpha.research_meta_expanding_2025_worker
          --model-id '${{ matrix.model }}'
          --input-csv shared/raw.csv
          --test-start 20250101
          --end 20260817
          --fixed-c 0.01
          --chunk-index '${{ matrix.chunk }}'
          --chunk-count 4
          --out 'work/${{ matrix.model }}_part${{ matrix.chunk }}.csv'
      - uses: actions/upload-artifact@v4
        with:
          name: meta-expanding-quick-${{ matrix.model }}-${{ matrix.chunk }}
          path: work/
          retention-days: 7

  aggregate:
    needs: worker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
      - name: Install frozen META runtime
        run: |
          pip install -r requirements/meta-fwd-001.lock.txt
          pip install -e . --no-deps
      - uses: actions/download-artifact@v4
        with:
          pattern: meta-expanding-quick-*
          path: work
          merge-multiple: true
      - name: Aggregate quick diagnostic
        run: >-
          python -m metaalpha.research_meta_expanding_2025_quick_aggregate
          --input-dir work
          --out reports/meta_hist_expanding_c001_2025_001
      - name: Commit quick report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/meta_hist_expanding_c001_2025_001/
          if git diff --cached --quiet; then
            echo 'No report change.'
            exit 0
          fi
          git commit -m 'research: record fixed-C expanding 2025 diagnostic'
          git pull --rebase origin main
          git push origin HEAD:main
