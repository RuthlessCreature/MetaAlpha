name: META_REGIME_NULL_2025_001 Regime-conditioned matched null

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-meta-regime-null-2025.yml'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
      - name: Install frozen META runtime
        run: |
          pip install -r requirements/meta-fwd-001.lock.txt
          pip install -e . --no-deps
      - name: Run regime-conditioned matched-null diagnostic
        run: >-
          python -m metaalpha.research_meta_regime_null_2025
          --provider sina
          --symbol 000001
          --raw-start 19901219
          --end 20260817
          --out reports/meta_regime_null_2025_001
      - name: Show summary
        if: success()
        run: cat reports/meta_regime_null_2025_001/SUMMARY.md
      - name: Commit retrospective report
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/meta_regime_null_2025_001/
          if git diff --cached --quiet; then
            echo 'No report change.'
            exit 0
          fi
          git commit -m 'research: record META_REGIME_NULL_2025_001 results'
          git pull --rebase origin main
          git push origin HEAD:main
