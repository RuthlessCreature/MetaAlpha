name: SSE Natal Transit Corrected Historical Exploration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-sse-natal.yml'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install -e '.[data]'
      - name: Run corrected historical natal-transit exploration on pinned Sina data
        run: >-
          python -m metaalpha.research_natal
          --fetch-akshare
          --provider sina
          --symbol 000001
          --start 19901219
          --end 20260814
          --out reports/sse_natal_corrected
          --min-n 100
      - name: Show correction status and provenance
        if: success()
        run: |
          cat reports/sse_natal_corrected/run_metadata.json
          cat reports/sse_natal_corrected/data_manifest.json
      - name: Upload corrected research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sse-natal-corrected-${{ github.sha }}
          path: reports/sse_natal_corrected
          if-no-files-found: warn
          retention-days: 30
