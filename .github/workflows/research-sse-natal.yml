name: SSE Natal Transit Historical Exploration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-sse-natal.yml'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install -e '.[data]'
      - name: Run historical exploratory natal-transit experiment
        run: >-
          python -m metaalpha.research_natal
          --fetch-akshare
          --symbol 000001
          --start 19901219
          --end 20260814
          --out reports/sse_natal_exploratory
          --min-n 100
      - name: Show evidence status and provenance
        if: success()
        run: |
          cat reports/sse_natal_exploratory/run_metadata.json
          cat reports/sse_natal_exploratory/data_manifest.json
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sse-natal-exploratory-${{ github.sha }}
          path: reports/sse_natal_exploratory
          if-no-files-found: warn
          retention-days: 30
