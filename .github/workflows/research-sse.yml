name: SSE Ziping Corrected v1 Reanalysis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-sse.yml'

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install -e '.[data]'
      - name: Run corrected Ziping v1 reanalysis on pinned Sina data
        run: >-
          metaalpha-ziping-sse
          --fetch-akshare
          --provider sina
          --symbol 000001
          --start 19901219
          --end 20260814
          --out reports/sse_ziping_corrected_v1
          --min-n 100
      - name: Show correction metadata and provenance
        if: success()
        run: |
          cat reports/sse_ziping_corrected_v1/run_metadata.json
          cat reports/sse_ziping_corrected_v1/data_manifest.json
      - name: Upload corrected research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sse-ziping-corrected-v1-${{ github.sha }}
          path: reports/sse_ziping_corrected_v1
          if-no-files-found: warn
          retention-days: 30
