name: Validate Forward Hotfix

on:
  push:
    branches: [main]
    paths:
      - 'ops/forward-hotfix-test-trigger.txt'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install -e '.[data,test]'
      - name: Run ZIPING forward regression tests
        run: python -m pytest -q tests/test_forward_ziping.py tests/test_forward_ziping_safe_score.py
